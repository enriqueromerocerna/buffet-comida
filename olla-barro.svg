<svg viewBox="0 0 128 124" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Olla de barro">
  <defs>
    <linearGradient id="ollaBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#CC7842"/>
      <stop offset="1" stop-color="#9A481F"/>
    </linearGradient>
    <linearGradient id="ollaLid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D5854D"/>
      <stop offset="1" stop-color="#AE5A2A"/>
    </linearGradient>
  </defs>

  <!-- Orejas / asas laterales (detrás del cuerpo) -->
  <path d="M22 60 q-13 1 -11 17 q11 -1 14 -10 z" fill="#A04C1E"/>
  <path d="M106 60 q13 1 11 17 q-11 -1 -14 -10 z" fill="#A04C1E"/>

  <!-- Cuerpo de la olla -->
  <path d="M18 66 C18 53 39 49 64 49 C89 49 110 53 110 66
           C110 93 92 116 64 116 C36 116 18 93 18 66 Z"
        fill="url(#ollaBody)"/>

  <!-- Brillo sutil -->
  <ellipse cx="48" cy="74" rx="13" ry="22" fill="#E0976035" />

  <!-- Tapa: borde -->
  <ellipse cx="64" cy="50" rx="47" ry="11" fill="#8C431D"/>
  <!-- Tapa: cúpula -->
  <ellipse cx="64" cy="44" rx="42" ry="13" fill="url(#ollaLid)"/>

  <!-- Asa de la tapa -->
  <ellipse cx="64" cy="32" rx="9" ry="3.5" fill="#8C431D"/>
  <rect x="59" y="19" width="10" height="14" rx="5" fill="#CC7842"/>
  <ellipse cx="64" cy="19" rx="7" ry="3.5" fill="#D5854D"/>
</svg>
